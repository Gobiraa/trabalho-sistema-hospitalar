spring.application.name=sistema-hospitalar

# Banco padrão: H2 em arquivo (zero configuração). Para PostgreSQL use: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/hospital;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
